# Reverse-DNS of the GitHub home: github.com/rajeshkumaravel/sheaf-browser.
# Icons in resources/ are generated geometry — `npm run icons` rebuilds them.
appId: io.github.rajeshkumaravel.sheafbrowser
productName: Sheaf Browser
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  # Native modules must live outside the asar archive.
  - node_modules/better-sqlite3/**
npmRebuild: true

# Public repo: releases are published to the GitHub Releases page.
publish:
  provider: github
  releaseType: release
  owner: rajeshkumaravel
  repo: sheaf-browser

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # UNSIGNED BY DESIGN. No Developer ID, no notarization. Consequences:
  #  - First launch is blocked by Gatekeeper; users bypass it once (right-click
  #    Open, or `xattr -dr com.apple.quarantine <app>`). See README "Installing".
  #  - macOS auto-update does NOT work for unsigned apps — Sparkle/electron-updater
  #    reject an unsigned bundle. Mac updates are manual (re-download).
  # `identity: null` disables signing. electron-builder still applies an ad-hoc
  # signature, which is what lets the app run at all on Apple Silicon.
  identity: null

dmg:
  artifactName: ${productName}-${version}-${arch}.dmg

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  # UNSIGNED BY DESIGN. SmartScreen shows "Windows protected your PC" on first
  # run until the download builds reputation; users click More info → Run anyway.
  # Windows auto-update still works unsigned (with the SmartScreen prompt).

nsis:
  artifactName: Sheaf-Browser-Setup-${version}.exe
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  icon: resources/icon.png
  category: Development
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  maintainer: Rajesh Kumaravel <16378062+rajeshkumaravel@users.noreply.github.com>
